<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salchiween 2026</title><style>
*{box-sizing:border-box}body{margin:0;background:#21152e;color:#fff4e7;font:16px system-ui,sans-serif}main{max-width:540px;margin:auto;padding:24px 18px}.card{background:#382349;border:1px solid #81558d;border-radius:24px;padding:24px;box-shadow:0 12px 30px #0003}h1,h2{text-align:center;color:#ffb34c}.hero{text-align:center;font-size:56px}.tag{text-align:center;color:#ffa3c5;font-weight:800}.btn{display:block;width:100%;border:0;border-radius:15px;padding:15px;margin:12px 0;background:#f78132;color:#24152e;font-weight:900;font-size:16px;text-align:center;text-decoration:none}.secondary{background:#bda0dd}input{width:100%;padding:13px;border-radius:12px;border:1px solid #bda0dd;font-size:16px}.clue{padding:16px;border-radius:14px;background:#4b315d;line-height:1.5}.small{font-size:13px;opacity:.85}.progress{height:10px;border-radius:10px;background:#5d426e;overflow:hidden}.bar{height:100%;background:#ffb34c}.preview{max-width:100%;max-height:240px;border-radius:12px;margin:12px auto;display:block}label{display:block;margin-top:16px;font-weight:700}a{color:#ffd58c}
</style></head><body><main id="app"></main><script>
const ACCOUNT="@TheSalchiClub",HASH="#Salchiween2026";
const stages=[
["🐊","El guardián del río","No soy salchi, pero tengo cuatro patas, muchos dientes y vigilo el río. ¿Dónde estoy?","Publica una historia con tu salchi junto al Caimán del Río."],
["🐾","Patitas en acción","Aquí los amigos de cuatro patas tienen un espacio especial para jugar. Encuéntralo.","Publica una historia divertida en el parque de perros."],
["🌙","La luna misteriosa","Me ves de noche en el cielo, pero aquí también puedes encontrarme junto al río.","Publica una historia con la Luna del Río."],
["✨","Estrella barranquillera","Barranquilla me vio nacer y Hollywood conoce mi nombre. Búscame junto al Magdalena.","Publica la foto más glamurosa de tu salchi junto a Sofía Vergara."],
["💃","El baile encantado","Mis caderas no mienten. Nací en Barranquilla y mi música viajó por el mundo.","Publica una historia bailando junto a la estatua de Shakira."],
["🎁","El tesoro escondido","¡Completaste las cinco postas! Regresa al punto de encuentro y muestra tu pasaporte digital.","Reclama tu tesoro con el equipo de The SalchiClub."]];
let s;try{s=JSON.parse(localStorage.getItem("salchiween_ig_2026"))}catch(e){}s=s||{name:"",step:0,done:false,proofs:[]};function save(){localStorage.setItem("salchiween_ig_2026",JSON.stringify(s))}function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let a=document.getElementById("app");if(!s.name){a.innerHTML='<div class="card"><div class="hero">🎃🌭👻</div><h1>SALCHIWEEN 2026</h1><p class="tag">SCAVENGER HUNT · THE SALCHICLUB</p><p>Encuentra los lugares secretos, comparte historias en Instagram y sube una captura para desbloquear cada pista.</p><label>Nombre de tu salchi</label><input id="dog" maxlength="40" placeholder="Ej. Martín"><button class="btn" onclick="start()">¡COMENZAR!</button></div>';return}
if(s.done){a.innerHTML='<div class="card"><div class="hero">🏆🎃</div><h1>¡TESORO DESBLOQUEADO!</h1><h2>'+esc(s.name)+'</h2><p>¡Completaste el Salchiween Scavenger Hunt 2026! Muestra esta pantalla al equipo de The SalchiClub para reclamar tu tesoro.</p><p class="small">Las capturas permanecen en este dispositivo; no se envían al organizador.</p><button class="btn secondary" onclick="reset()">Comenzar de nuevo</button></div>';return}
let x=stages[s.step],pct=Math.round(s.step/5*100);a.innerHTML='<div class="card"><p class="tag">🎃 SALCHIWEEN · '+esc(s.name)+'</p><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><p class="small">Posta '+(s.step+1)+' de 5</p><div class="hero">'+x[0]+'</div><h2>'+x[1]+'</h2><div class="clue">'+x[2]+'</div><p><strong>📸 Reto:</strong> '+x[3]+'</p><p>Etiqueta a <strong>'+ACCOUNT+'</strong> y usa <strong>'+HASH+'</strong>.</p><p class="small">Publica la historia en Instagram, toma una captura de pantalla y vuelve aquí para adjuntarla.</p><a class="btn secondary" href="https://www.instagram.com/" target="_blank" rel="noopener">Abrir Instagram ↗</a><label for="proof">Subir screenshot de mi historia</label><input type="file" id="proof" accept="image/*" onchange="previewProof(event)"><div id="preview"></div><button id="next" class="btn" disabled onclick="advance()">Desbloquear siguiente posta 🔓</button><p class="small">La miniweb solo comprueba que seleccionaste una imagen, no verifica que la historia se haya publicado. La captura no se almacena ni se envía a The SalchiClub.</p><button class="btn secondary" onclick="alternative()">No tengo Instagram</button></div>'}
function start(){let v=document.getElementById("dog").value.trim();if(!v)return alert("Escribe el nombre de tu salchi");s.name=v;save();render()}
function previewProof(e){let f=e.target.files[0];if(!f||!f.type.startsWith("image/"))return;let u=URL.createObjectURL(f);document.getElementById("preview").innerHTML='<p class="small">Captura seleccionada ✓</p><img class="preview" alt="Vista previa de la evidencia" src="'+u+'">';document.getElementById("next").disabled=false}
function advance(){s.proofs[s.step]="Captura seleccionada";s.step++;if(s.step>=5)s.done=true;save();render();scrollTo(0,0)}
function alternative(){if(confirm("¿No tienes Instagram? Puedes tomar una foto del lugar y mostrarla al equipo al final. ¿Deseas usar esta alternativa?")){document.querySelector("label[for=proof]").textContent="Subir foto del lugar como evidencia";alert("Selecciona una foto del lugar para continuar. Muéstrala al equipo al finalizar.")}}
function reset(){if(confirm("¿Reiniciar el juego?")){localStorage.removeItem("salchiween_ig_2026");location.reload()}}
render();
</script></body></html>
