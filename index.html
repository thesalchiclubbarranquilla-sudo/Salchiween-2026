<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salchiween 2026</title>
<style>
:root{--c:#fff4df;--o:#f47b20;--p:#5a2a82;--r:#ef5b83;--i:#292238}*{box-sizing:border-box}body{margin:0;background:var(--c);font-family:system-ui,-apple-system,sans-serif;color:var(--i)}main{max-width:520px;margin:auto;padding:24px 18px}.card{background:white;border:2px solid #ead9c0;border-radius:24px;padding:24px;box-shadow:0 8px 24px #5a2a8215}.logo,h1,h2{text-align:center;color:var(--p)}.hero{text-align:center;font-size:58px}.tag{text-align:center;color:var(--o);font-weight:900}.btn,input{width:100%;padding:14px;border-radius:14px;font-size:16px;margin-top:10px}.btn{border:0;background:var(--o);color:white;font-weight:900}.clue,.mission{padding:14px;border-radius:12px;margin:14px 0}.clue{background:#fff7ef;border-left:5px solid var(--o)}.mission{background:#f6efff}.progress{height:10px;background:#eee0ca;border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--r)}.tiny{text-align:center;font-size:13px;opacity:.7}.msg{text-align:center;font-weight:800;margin-top:12px}
</style></head><body><main><div id="app"></div></main><script>
const stages=[
["🐊","La criatura del río","No soy salchi, pero también tengo cuatro patas. Vivo junto al río, tengo muchos dientes y observo a quienes pasan por aquí. Encuéntrame.","Busca el código secreto de Salchiween.","CAIMAN31","S"],
["🐾","Territorio de cuatro patas","Hay un rincón del Malecón hecho especialmente para correr, jugar y conocer amigos de cuatro patas. Tu siguiente pista está allí.","Encuentra la señal de Salchiween.","PATITAS26","A"],
["🌙","La luz que no está en el cielo","Normalmente aparezco cuando cae la noche, pero aquí no necesitas mirar hacia arriba para encontrarme. Busca la luna junto al río.","Tómense una foto embrujada y localicen el código.","LUNA2026","L"],
["✨","Glamour barranquillero","Barranquilla me vio nacer y Hollywood aprendió mi nombre. Hoy vigilo el Magdalena sin moverme de mi lugar. ¿Quién soy?","Haz la pose más glamurosa de tu salchi y encuentra el código.","SOFIA26","C"],
["💃","Las caderas no mienten","Soy barranquillera, mi música recorrió el mundo y mis caderas nunca mienten. Encuéntrame para acercarte al tesoro.","Graba 5 segundos de baile con tu salchi y busca el código.","SHAKIRA26","H"],
["👻","Algo falta…","Creyeron que habían terminado, pero el tesoro sigue cerrado. Regresen al punto donde comenzó la aventura. Allí encontrarán la última letra.","Escribe la palabra secreta de seis letras.","SALCHI","I"]];
let s=JSON.parse(localStorage.getItem("sw26")||'{"page":"home","name":"","n":0,"letters":[]}');
const app=document.getElementById("app");function save(){localStorage.setItem("sw26",JSON.stringify(s))}
function wrap(x){return `<div class=card>${x}</div><p class=tiny>The SalchiClub · Barranquilla · Salchiween 2026</p>`}
function render(){if(s.page==="home")app.innerHTML=wrap(`<div class=logo><b>THE SALCHICLUB</b></div><div class=hero>🎃🌭👻</div><h1>SALCHIWEEN</h1><div class=tag>SCAVENGER HUNT 2026</div><p>Algo extraño ocurrió en el Malecón… el tesoro de Salchiween desapareció.</p><p>🔎 Resuelve las pistas<br>🐾 Supera los retos<br>🔐 Descubre los códigos<br>🎁 Recupera el tesoro</p><button class=btn onclick="s.page='reg';save();render()">COMENZAR AVENTURA</button>`);
else if(s.page==="reg")app.innerHTML=wrap(`<h2>🎃 Pasaporte Salchiween</h2><p>Escribe el nombre de tu salchi:</p><input id=dog placeholder="Nombre del salchi"><button class=btn onclick="reg()">INICIAR BÚSQUEDA</button>`);
else if(s.page==="game"){let x=stages[s.n];app.innerHTML=wrap(`<div class=progress><div class=bar style="width:${(s.n/6)*100}%"></div></div><p class=tiny>Detective: <b>${s.name}</b> · Pista ${s.n+1} de 6</p><div class=hero>${x[0]}</div><h2>${x[1]}</h2><div class=clue>${x[2]}</div><div class=mission><b>🐾 Misión</b><br>${x[3]}</div><input id=code placeholder="${s.n===5?'Palabra secreta':'Código secreto'}"><button class=btn onclick="check()">DESBLOQUEAR</button><div id=msg></div><p class=tiny>Letras: ${s.letters.join(" · ")||"—"}</p>`)}
else app.innerHTML=wrap(`<div class=hero>🏆🎃</div><h1>¡TESORO DESBLOQUEADO!</h1><h2>${s.name}</h2><p style="text-align:center">completó el <b>Salchiween Scavenger Hunt 2026</b> 🌭🐾👻</p><p style="text-align:center">Muéstrale esta pantalla al equipo de <b>The SalchiClub</b>.</p><h2>🎁 ¡Tu tesoro te está esperando!</h2><button class=btn onclick="localStorage.removeItem('sw26');location.reload()">JUGAR DE NUEVO</button>`)}
function reg(){let v=document.getElementById("dog").value.trim();if(v){s.name=v;s.page="game";save();render()}}
function check(){let v=document.getElementById("code").value.trim().toUpperCase(),x=stages[s.n],m=document.getElementById("msg");if(v!==x[4]){m.innerHTML='<div class=msg style="color:#b33">👻 Ese no es el código… sigue buscando.</div>';return}s.letters.push(x[5]);if(s.n===5)s.page="done";else s.n++;save();render()}render();
</script></body></html>
